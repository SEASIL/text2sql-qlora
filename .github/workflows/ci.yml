name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install CPU-only torch to keep CI fast and light
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install pytest sqlglot pydantic pyyaml

    - name: Run unit tests
      run: |
        python -m pytest -v tests/
